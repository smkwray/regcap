[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "regcap"
version = "0.1.0"
description = "Domestic regulatory capacity integrator for Treasury absorption mechanisms."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.6",
  "pytest>=8.0",
]

[project.scripts]
regcap = "regcap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"

[tool.ruff.lint]
# Explicit correctness checks independent of Ruff version defaults.
select = ["E4", "E7", "E9", "F"]
