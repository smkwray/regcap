mechanisms:
  - mechanism_id: slr_leverage_capacity
    mechanism_label: SLR / leverage capacity
    research_function: Leverage-denominator constraint on bank Treasury and reserve absorption.
    primary_existing_project: slrwatch
    supporting_projects:
      - bankcap
    public_data_sources:
      - FFIEC Call Reports
      - FR Y-9C
      - FR Y-15
      - Federal Reserve H.8
      - NY Fed primary dealer statistics
    frequency: Quarterly for Call Reports, FR Y-9C, and FR Y-15; weekly or monthly for H.8 screens.
    cleanest_estimand: Differential Treasury, reserve, and safe-asset balance-sheet response for institutions with weaker leverage capacity around explicit rule or regime variation.
    identification_leverage: Best around policy/event designs such as 2020 SLR relief, but current source evidence is mixed; safer as a mechanism screen and regime classifier.
    tdc_connection: Constrains bank willingness to absorb Treasuries and reserves, shaping whether issuance maps into bank securities, deposits, reserves, dealers, MMFs, or the Fed.
    claim_boundary_safe: Leverage pressure is a plausible domestic absorption constraint and current public evidence is cautionary rather than settled.
    claim_boundary_unsafe: SLR relief robustly caused Treasury absorption across samples or proves the TDC deposit response.
    research_priority_note: Guarded mechanism/regime classification; a headline causal absorption claim requires stronger evidence.
    implementation_priority: 3

  - mechanism_id: lcr_hqla_demand
    mechanism_label: LCR / HQLA demand
    research_function: Liquidity regulation can create demand for Treasuries as high-quality liquid assets even when balance-sheet space is costly.
    primary_existing_project: bankcap
    supporting_projects:
      - slrwatch
      - qrawatch
    public_data_sources:
      - FR Y-9C liquidity and securities categories
      - Federal Reserve H.8 cash assets and securities aggregates
      - public liquidity disclosures where available
      - Treasury maturity composition outputs from qrawatch
    frequency: Mostly quarterly; H.8 proxy is weekly or monthly.
    cleanest_estimand: Whether liquidity-buffer pressure predicts shifts toward cash, reserves, bills, or HQLA-like Treasury securities across bank groups or parent firms.
    identification_leverage: Weaker unless a threshold, rule change, or sharp event can be isolated; useful as classification and interaction mechanism.
    tdc_connection: May tilt domestic bank demand toward bills or liquid Treasury claims when Treasury supply needs domestic balance-sheet absorption.
    claim_boundary_safe: Liquidity needs may tilt bank demand toward high-quality liquid Treasury claims.
    claim_boundary_unsafe: LCR mechanically predicts marginal Treasury absorption without direct measurement or a clean design.
    research_priority_note: Supporting variable registry and design notes; stronger threshold/event leverage is needed before a standalone backend.
    implementation_priority: 4

  - mechanism_id: gsib_window_dressing
    mechanism_label: G-SIB surcharge / reporting-date window dressing
    research_function: Calendar and reporting-date balance-sheet incentives can affect bank and dealer Treasury/repo positions.
    primary_existing_project: slrwatch
    supporting_projects:
      - bidbridge
    public_data_sources:
      - FR Y-15 snapshots
      - OFR Bank Systemic Risk Monitor
      - NY Fed primary dealer statistics
      - quarter-end and year-end calendar indicators
    frequency: Annual or mixed for G-SIB indicators; weekly for dealer and repo overlays.
    cleanest_estimand: Reporting-window changes in dealer positions, repo intermediation, or bank exposures around quarter-end and year-end snapshots.
    identification_leverage: Calendar/event design around reporting dates; better as market-functioning sidecar than main TDC determinant.
    tdc_connection: Can explain temporary absorption-capacity windows and dealer intermediation variation around reporting dates.
    claim_boundary_safe: Reporting-date incentives may create predictable capacity windows.
    claim_boundary_unsafe: G-SIB scores create permanent Treasury demand or explain broad TDC deposit movements without granular evidence.
    research_priority_note: Appendix and supporting calendar-capacity research; outside the headline scope.
    implementation_priority: 5

  - mechanism_id: dealer_repo_bridge
    mechanism_label: Dealer leverage / repo intermediation constraints
    research_function: Primary dealers warehouse Treasury supply before it reaches final holders.
    primary_existing_project: bidbridge
    supporting_projects:
      - qrawatch
      - slrwatch
    public_data_sources:
      - Treasury auction data
      - NY Fed primary dealer statistics
      - Treasury investor-class auction allotments
      - SOMA holdings
      - repo financing context
    frequency: Weekly and auction-level.
    cleanest_estimand: Within-week, across-maturity conditional association between announced offering amounts and dealer-position changes.
    identification_leverage: Supply-only maturity-bucket and week fixed effects; supporting binary LP fails clean timing diagnostics. No established QT amplification or structural causal interpretation.
    tdc_connection: Dealer warehousing is the bridge between Treasury issuance and later bank, MMF, foreign, household, or Fed absorption.
    claim_boundary_safe: Larger within-week offering amounts are associated with greater dealer-position changes across maturity buckets.
    claim_boundary_unsafe: Dealer inventory accumulation proves final domestic absorption.
    research_priority_note: Configured navigation priority only; read the pinned producer association and diagnostic limits.
    implementation_priority: 1

  - mechanism_id: duration_loss_aoci_htm
    mechanism_label: Duration-loss / AOCI / HTM pressure
    research_function: Unrealized losses and duration exposure can reduce banks' willingness or ability to absorb coupon and duration-heavy supply.
    primary_existing_project: slrwatch
    supporting_projects:
      - bankcap
      - qrawatch
    public_data_sources:
      - FFIEC Call Reports
      - FR Y-9C
      - AFS and HTM securities disclosures
      - unrealized gain/loss fields
      - Federal Reserve H.8 securities and cash aggregates
      - Treasury coupon and duration supply measures
    frequency: Quarterly at bank or parent level; weekly or monthly for coarse H.8 proxies.
    cleanest_estimand: Regime interaction between duration-loss pressure and bank Treasury share or securities absorption during 2022-23 rate shock, banking stress, and QT normalization windows.
    identification_leverage: Strong research leverage; not cleanly causal without predetermined exposure or sharper event design.
    tdc_connection: Coupon-heavy or long-duration issuance may require nonbank, dealer, foreign, or Fed absorption when bank duration capacity is impaired.
    claim_boundary_safe: Duration-loss pressure is a plausible regime-dependent absorption constraint.
    claim_boundary_unsafe: Duration losses alone explain the TDC deposit residual.
    research_priority_note: Configured research hypothesis; no promotion follows from ordering or guarded language alone.
    implementation_priority: 2
